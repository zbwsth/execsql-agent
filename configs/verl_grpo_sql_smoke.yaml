# ExecSQL-Agent reviewable override manifest for verl v0.9.0.
#
# verl's official v0.9.0 examples compose the packaged ppo_trainer config and
# pass Hydra overrides on the CLI. This file records the same intended values
# for review and tests; scripts/run_verl_grpo_smoke.sh is the executable source.

target:
  verl_tag: v0.9.0
  entrypoint: verl.trainer.main_ppo
  model: Qwen/Qwen3-0.6B
  rollout_backend: vllm

data:
  train_files: data/grpo_smoke/train.parquet
  val_files: data/grpo_smoke/val.parquet
  train_batch_size: 2
  val_batch_size: 2
  max_prompt_length: 1024
  max_response_length: 256

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

actor:
  ppo_mini_batch_size: 8
  ppo_micro_batch_size_per_gpu: 1
  use_kl_loss: true
  kl_loss_coef: 0.001
  fsdp_param_offload: true
  fsdp_optimizer_offload: true

reference:
  log_prob_micro_batch_size_per_gpu: 1
  fsdp_param_offload: true

rollout:
  name: vllm
  n: 4
  tensor_model_parallel_size: 1
  gpu_memory_utilization: 0.35
  enforce_eager: true
  max_model_len: 1280
  max_num_batched_tokens: 1280
  max_num_seqs: 8

reward:
  manager: naive
  custom_reward_function:
    path: training/verl_sql_reward.py
    name: compute_score
    database_root: .

trainer:
  use_v1: true
  n_gpus_per_node: 1
  nnodes: 1
  total_training_steps: 2
  logger:
    - console
  save_freq: 1
  test_freq: 1
  val_before_train: false
  resume_mode: disable
  default_local_dir: outputs/verl_grpo_sql_smoke
